name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    name: Validate application files
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Check required application files
        run: |
          required_files=(
            index.html style.css app.js ingredients.js motion.js prompts.js sw.js
            ingredients-db.json inspiration.json manifest.webmanifest
            icon-192.png icon-512.png skin-editorial.jpg hair-editorial.jpg
          )
          failed=0
          for file in "${required_files[@]}"; do
            if [[ ! -f "$file" || ! -s "$file" ]]; then
              echo "Missing or empty application file: $file"
              failed=1
            fi
          done
          exit "$failed"

      - name: Check JavaScript syntax
        if: ${{ !cancelled() }}
        run: |
          failed=0
          while IFS= read -r -d '' file; do
            echo "Checking $file"
            node --check "$file" || failed=1
          done < <(git ls-files -z -- '*.js' '*.mjs' '*.cjs')
          exit "$failed"

      - name: Validate JSON and web manifests
        if: ${{ !cancelled() }}
        run: |
          failed=0
          while IFS= read -r -d '' file; do
            echo "Validating $file"
            node -e 'JSON.parse(require("node:fs").readFileSync(process.argv[1], "utf8"))' "$file" || failed=1
          done < <(git ls-files -z -- '*.json' '*.webmanifest')
          exit "$failed"

  tests:
    name: Unit and Chromium regression tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Run unit tests
        run: npm run test:unit | tee unit-test-results.txt
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - name: Save regression reports and failure evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: chromium-regression-results
          path: |
            playwright-report/
            test-results/
            unit-test-results.txt
          retention-days: 14
          if-no-files-found: ignore

  audit:
    name: Layout and WCAG audit (known issues, non-blocking)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Keep known product defects visible without disabling the stable regression gate.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:audit
      - name: Save audit findings and screenshots
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: chromium-audit-results
          path: |
            playwright-report/
            test-results/
          retention-days: 14
          if-no-files-found: ignore
